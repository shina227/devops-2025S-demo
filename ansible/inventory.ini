# Values come from `terraform output` in terraform/local
[app]
app-server ansible_host=127.0.0.1 ansible_port=22 private_ip=172.30.0.10

[db]
db-server ansible_host=127.0.0.1 ansible_port=2223 private_ip=172.30.0.20

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/alu-devops
ansible_python_interpreter=/usr/bin/python3
# The boxes get new host keys on every terraform apply, so don't pin them
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
# Lets become_user: postgres work without extra packages on the server
ansible_pipelining=true
