apiVersion: v1
kind: Service
metadata:
  name: my-app-service
spec:
  type: NodePort # Makes the service accessible from your local machine
  selector:
    app: my-app # This MUST match the matchLabels.app in your deployment.yaml
  ports:
    - port: 8080 # The port exposed by the service
      targetPort: 80 # The port your container is listening on
