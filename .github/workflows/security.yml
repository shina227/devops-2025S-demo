name: Security

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code:
    name: Code scan (Bandit)
    runs-on: ubuntu-latest
    # Policy: report every finding, block only on Medium+ severity AND Medium+ confidence.
    # Low findings (e.g. B105) are often false positives: they stay visible in the
    # report but do not block, so the gate stays trusted instead of being switched off.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: python -m pip install --upgrade bandit
      - name: Bandit report (all severities, never fails)
        run: bandit -r . -f screen --exit-zero
      - name: Bandit gate (Medium+ severity, Medium+ confidence)
        run: bandit -r . -f screen -ll -ii

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build --pull -t campus-notifier:dev . # --pull: always start from the latest patched base
      - name: Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: campus-notifier:dev
          # Policy: a CRITICAL vulnerability with a published fix fails the build.
          # Unfixed ones are reported in the register, since there is nothing to upgrade to yet.
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  iac:
    name: IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          quiet: true
          # Policy: any failed check blocks; accepted risks are suppressed in-line with checkov:skip + justification.
          soft_fail: false
